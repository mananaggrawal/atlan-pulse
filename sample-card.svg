<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Skill health summary">
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2026D2"/>
      <stop offset="100%" stop-color="#62E1FC"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#141517"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="100" y="96" width="120" height="4" fill="url(#rule)"/>
  <text x="100" y="152" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="3" fill="#62E1FC">ATLAN PULSE — SKILL HEALTH</text>
  <text x="100" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF">Most of my agent skills are dead weight.</text>
  
    <text x="100" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">6</text>
    <text x="100" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9A9AB4">skills installed</text>
    <text x="600" y="322" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">2</text>
    <text x="600" y="356" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9A9AB4">never invoked in 90 days</text>
    <text x="100" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">83%</text>
    <text x="100" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9A9AB4">of all runs are just 3 skills</text>
    <text x="600" y="462" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">6%</text>
    <text x="600" y="496" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#9A9AB4">of context spent on dead skills</text>
  <text x="100" y="566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="26" fill="#FFFFFF">npx atlan-pulse</text>
  <text x="1100" y="566" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#77778E">aggregate numbers only — no skill names left this machine</text>
</svg>