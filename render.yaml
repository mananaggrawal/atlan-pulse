# Free tier, no card on file, no persistent disk: connection tokens, run
# history and published cards live on the container's local disk and are
# lost on every restart or redeploy, and the free instance spins down after
# 15 minutes idle (cold start on the next request). Both are accepted here
# because this is a demo/submission deployment, not a running product — see
# README "Deploying" for the upgrade path (add a disk + `plan: starter`,
# which needs payment info on file) once persistence actually matters.
#
# Chromium is still needed for the PDF and the card PNG, which is why this
# stays a Docker service on the Playwright base image rather than a plain
# Node web service — a plain runtime would have to download a browser at
# boot, onto a disk that does not persist anyway on this tier.
services:
  - type: web
    name: atlan-pulse-skill-health
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3001
      - key: PULSE_BASE_URL
        sync: false          # set to the public HTTPS origin; card and report URLs are built from it
      - key: PULSE_DATA_DIR
        value: /data/runs
      # PULSE_ALLOW_ANONYMOUS is deliberately absent. Local development sets it
      # to 1; a deployed instance must require a token.
